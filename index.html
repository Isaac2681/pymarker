<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d13" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PyMarker" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>PyMarker — Python Challenges</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
  <link rel="stylesheet" href="style.css?v=2026112405" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("pymarker.theme")==="light"?"light":"dark"}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <button id="btn-nav-menu" class="btn icon ghost nav-menu-btn" aria-label="Open menu" aria-controls="menu-drawer" aria-expanded="false" title="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button id="btn-menu" class="btn icon ghost menu-btn" aria-label="Show problem list" aria-controls="sidebar" aria-expanded="false" title="Problem list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
    </button>
    <div class="problem-nav">
      <button id="btn-prev" class="btn icon ghost" title="Previous problem">‹</button>
      <button id="btn-next" class="btn icon ghost" title="Next problem">›</button>
    </div>
    <a class="brand" href="#/" aria-label="PyMarker home">
      <div class="logo-mark" aria-hidden="true">Py</div>
      <div class="brand-name">PyMarker</div>
    </a>
    <nav class="main-nav" aria-label="Main">
      <a href="#/" data-nav="roadmap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg><span>Roadmap</span></a>
      <a href="#/problems" data-nav="problems">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5"/></svg><span>Problems</span></a>
    </nav>

    <div class="chips">
      <div class="chip" title="Days in a row you've solved something"><span class="chip-ico">🔥</span><b id="stat-streak">0</b><span>day streak</span></div>
      <div class="chip" title="Marks earned"><b id="stat-points">0</b><span id="stat-max">/ 0 marks</span></div>
      <button class="learner-btn" id="btn-learner" aria-label="Switch learner">
        <span class="avatar" id="learner-initial">👤</span><span class="learner-name" id="learner-name"></span>
        <span id="sync-dot" class="sync-dot off" role="img" aria-label="Sync status" hidden></span>
      </button>
      <button class="grade-pill" id="btn-dashboard" title="Open your progress report">
        <span class="grade-letter" id="stat-grade">U</span>
        <span class="grade-pct" id="stat-pct">0%</span>
      </button>
      <button class="btn icon ghost" id="btn-theme" title="Switch light / dark theme" aria-label="Switch light / dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
      </button>
    </div>

    <div id="py-status" class="py-status loading" title="Python runtime"><span class="dot"></span><span class="txt">Loading Python</span></div>
  </header>

  <!-- ═══ Main menu (slide-out) ═══ -->
  <aside id="menu-drawer" class="menu-drawer" aria-label="Menu" hidden>
    <div class="menu-head"><span>Menu</span>
      <button class="btn icon ghost" id="menu-close" aria-label="Close menu" title="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4v16M15 12H4m0 0 5-5m-5 5 5 5"/></svg>
      </button>
    </div>
    <nav id="menu-body"></nav>
  </aside>
  <div id="menu-backdrop" class="backdrop" hidden></div>

  <!-- ═══ Generic page (tracks, cheatsheets, quizzes, system design) ═══ -->
  <main id="view-page" class="view" hidden><div id="page-body" class="page-wrap"></div></main>

  <!-- ═══ Roadmap ═══ -->
  <main id="view-roadmap" class="view" hidden>
    <section class="rm-canvas" aria-label="Topic roadmap">
      <div class="rm-intro">
        <h1>Python roadmap</h1>
        <p>Work down the map. Each topic builds on the ones above it. Click a topic to see its problems.</p>
      </div>
      <div class="rm-graph-wrap">
        <svg id="rm-edges" aria-hidden="true"></svg>
        <div id="rm-graph"></div>
      </div>
    </section>
    <aside class="rm-side">
      <div class="card" id="rm-stats"></div>
      <div class="card" id="rm-cal"></div>
    </aside>
  </main>

  <!-- ═══ Problem list ═══ -->
  <main id="view-problems" class="view" hidden>
    <div class="pl-wrap">
      <div class="pl-head">
        <div>
          <h1>Problems</h1>
          <p class="muted" id="pl-summary"></p>
        </div>
        <a class="btn" href="#/problem/playground">✦ Playground</a>
      </div>
      <div class="pl-filters">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="pl-search" type="search" placeholder="Search problems" autocomplete="off" />
        </div>
        <select id="pl-topic" aria-label="Topic"></select>
        <div class="seg" id="pl-level" aria-label="Level">
          <button data-level="all">All</button><button data-level="beginner">Beginner</button><button data-level="intermediate">Intermediate</button><button data-level="advanced">Advanced</button>
        </div>
        <div class="seg" id="pl-status" aria-label="Status">
          <button data-status="all">All</button><button data-status="todo">To do</button><button data-status="done">Solved</button>
        </div>
      </div>
      <div id="pl-body"></div>
    </div>
  </main>

  <!-- ═══ Topic drawer (opened from the roadmap) ═══ -->
  <aside id="topic-drawer" class="topic-drawer" aria-label="Topic problems" hidden>
    <div class="td-head">
      <div><h2 id="td-title"></h2><p id="td-sub" class="muted"></p></div>
      <button class="btn icon ghost" id="td-close" aria-label="Close">✕</button>
    </div>
    <div id="td-body"></div>
  </aside>
  <div id="topic-backdrop" class="backdrop" hidden></div>

  <!-- ═══ Problem workspace ═══ -->
  <div class="layout view" id="view-problem" hidden>
    <aside id="sidebar" aria-label="Problem list">
      <div class="side-top">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search problems" autocomplete="off" />
        </div>
        <div class="seg" id="filters">
          <button data-filter="all">All</button><button data-filter="todo">To do</button><button data-filter="done">Solved</button><button data-filter="if" title="Only if / elif / else practice">if/else</button>
        </div>
      </div>
      <nav id="ch-list"></nav>
    </aside>
    <div id="drawer-backdrop" class="backdrop" hidden></div>

    <main class="workspace">
      <section class="pane left">
        <div class="tabs" id="left-tabs">
          <button data-tab="task"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg>Question</button>
          <button data-tab="help"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>Hints <span class="tab-dot" id="help-dot" hidden></span></button>
          <button data-tab="solution"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0"/></svg>Solution</button>
          <button data-tab="subs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5M12 7v5l3 2"/></svg>Submissions</button>
        </div>
        <div class="pane-body" id="left-body">
        </div>
      </section>

      <section class="pane right">
        <div class="toolbar">
          <span class="lang-tag">Python 3</span>
          <span class="spacer"></span>
          <span id="sync-status" class="sync" hidden></span>
          <button id="btn-vscode" class="btn ghost" hidden title="Edit this challenge in Visual Studio Code — changes sync both ways">
            <svg viewBox="0 0 24 24" class="vs-ico" aria-hidden="true"><path d="M17.5 2 8.6 10.2 4.1 6.8 2 7.9v8.2l2.1 1.1 4.5-3.4 8.9 8.2 4.5-2.2V4.2L17.5 2Zm0 5.3v9.4l-6.2-4.7 6.2-4.7ZM4.3 9.6 6.7 12l-2.4 2.4V9.6Z"/></svg>
            <span id="vscode-label">Edit in VS Code</span>
          </button>
          <div class="btn-group">
            <button id="font-dec" class="btn ghost icon" title="Smaller text">A−</button>
            <button id="font-inc" class="btn ghost icon" title="Bigger text">A+</button>
          </div>
          <button id="btn-reset" class="btn ghost icon" title="Reset to starter code">↺</button>
        </div>
        <div class="keybar" id="keybar" aria-label="Coding keys">
          <button data-key="indent" title="Indent">⇥</button><button data-key="dedent" title="Unindent">⇤</button>
          <button data-ins=":">:</button><button data-pair="()">( )</button><button data-pair='""'>" "</button>
          <button data-pair="[]">[ ]</button><button data-ins=" = ">=</button><button data-ins=" == ">==</button>
          <button data-ins=" != ">!=</button><button data-ins=" < ">&lt;</button><button data-ins=" > ">&gt;</button>
          <button data-ins=" <= ">&lt;=</button><button data-ins=" >= ">&gt;=</button><button data-pair="''">' '</button>
          <button data-pair="{}">{ }</button><button data-ins="#">#</button><button data-ins="_">_</button>
          <button data-key="undo" title="Undo">↶</button><button data-key="redo" title="Redo">↷</button>
        </div>
        <div class="editor-wrap"><textarea id="editor"></textarea></div>
        <div class="console">
          <div class="console-head">
            <div class="tabs small" id="console-tabs">
              <button data-ctab="input">Testcases</button>
              <button data-ctab="results">Result</button>
            </div>
            <span class="spacer"></span>
            <button id="btn-run" class="btn"><span>▶ Run</span><kbd>⌘↵</kbd></button>
            <button id="btn-submit" class="btn submit"><span>Submit</span><kbd>⌘⇧↵</kbd></button>
          </div>
          <div id="console-results" class="console-body"></div>
          <div id="console-input" class="console-body" hidden>
            <div id="case-pills" class="case-pills"></div>
            <div id="stdin-wrap">
              <label for="stdin" class="k">Program input</label>
              <textarea id="stdin" rows="3" spellcheck="false" placeholder="Ada&#10;42"></textarea>
              <p class="muted small">One line per <code>input()</code> call. Used when you press ▶ Run.</p>
            </div>
            <div id="case-detail"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close btn icon ghost" data-close title="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <input type="file" id="import-file" accept="application/json" hidden />
  <div id="toasts" aria-live="polite"></div>
  <div id="confetti" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="challenges.js?v=2026112405"></script>
  <script src="content/learn.js?v=2026112405"></script>
  <script src="content/sql.js?v=2026112405"></script>
  <script src="content/ml.js?v=2026112405"></script>
  <script src="content/lld.js?v=2026112405"></script>
  <script src="sync-config.js?v=2026112405"></script>
  <script src="app.js?v=2026112405"></script>
</body>
</html>
